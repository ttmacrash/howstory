<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="하우스토리 조립 PC 고객 후기 전체 보기">
<title>하우스토리 고객 후기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23171B26'/%3E%3Cg fill='none' stroke='%23F2B84B' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' transform='translate(2 2) scale(.8333)'%3E%3Cpath d='M4.5 10.5 12 4l7.5 6.5'/%3E%3Cpath d='M6 9.5V17a1.5 1.5 0 0 0 1.5 1.5h5.5l4 3.2v-3.2A1.5 1.5 0 0 0 18 17V9.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root { --bg:#FFFFFF; --bg-2:#F7F7F7; --bg-3:#EFEFEF; --ink:#000; --ink-2:#555; --ink-3:#999; --line:#E5E5E5; --line-2:#000; --btn:#000; --btn-ink:#FFF; --accent:#E9A23B; --accent-ink:#1A1A1A; --accent-soft:#FBF1DF; --dot:rgba(0,0,0,.16); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#151A24; --bg-2:#1C2230; --bg-3:#252C3B; --ink:#F4F2EC; --ink-2:#C3C8D2; --ink-3:#8B92A0; --line:#2C3444; --line-2:#F4F2EC; --btn:#F2B44C; --btn-ink:#151A24; --accent:#F2B44C; --accent-ink:#151A24; --accent-soft:#2E2A22; --dot:rgba(255,255,255,.18); } }
  :root[data-theme="dark"] { --bg:#151A24; --bg-2:#1C2230; --bg-3:#252C3B; --ink:#F4F2EC; --ink-2:#C3C8D2; --ink-3:#8B92A0; --line:#2C3444; --line-2:#F4F2EC; --btn:#F2B44C; --btn-ink:#151A24; --accent:#F2B44C; --accent-ink:#151A24; --accent-soft:#2E2A22; --dot:rgba(255,255,255,.18); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Pretendard, "Pretendard Variable", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size:15px; line-height:1.6; letter-spacing:-0.01em; -webkit-font-smoothing:antialiased; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display:none !important; }
  .wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:16px; height:60px; border-bottom:1px solid var(--line-2); }
  .brand { display:inline-flex; align-items:center; gap:10px; font-weight:900; font-size:20px; letter-spacing:-0.04em; text-decoration:none; white-space:nowrap; }
  .brand svg { width:30px; height:auto; color:var(--accent); }
  .brand small { font-weight:500; font-size:11px; letter-spacing:.22em; color:var(--ink-3); }
  .cta { font-size:13px; font-weight:700; padding:8px 14px; background:var(--btn); color:var(--btn-ink); text-decoration:none; white-space:nowrap; }
  .back { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; text-decoration:none; padding:7px 12px; border:1px solid var(--ink); background:var(--bg); white-space:nowrap; }
  .back:hover { background:var(--btn); color:var(--btn-ink); }
  .top .r { display:flex; gap:8px; align-items:center; }
  .head { padding-block: 28px 18px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px; }
  h1 { margin:0; font-size: 28px; font-weight: 900; letter-spacing:-0.03em; }
  h1 span { color: var(--accent); }
  .sum { font-size: 14px; color: var(--ink-2); margin-top: 6px; }
  .sum b { color: var(--ink); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:var(--bg); color:var(--ink-2); padding:7px 12px; font-size:13px; cursor:pointer; font-weight:500; }
  .chip[aria-pressed="true"] { background:var(--btn); border-color:var(--btn); color:var(--btn-ink); font-weight:700; }
  .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; padding-block: 8px 48px; }
  .rvc { background:var(--bg-2); padding:18px; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .rvc .tp { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .rvc .name { font-weight:700; font-size:14px; }
  .rvc .name small { font-weight:500; color:var(--ink-3); margin-left:6px; }
  .rvc .stars { color:var(--accent); letter-spacing:2px; font-size:14px; white-space:nowrap; }
  .rvc .body { font-size:14px; color:var(--ink-2); white-space:pre-wrap; }
  .rvc .media { display:grid; grid-template-columns: repeat(3, 1fr); gap:4px; }
  .rvc .media a, .rvc .media video { display:block; aspect-ratio:1; background:var(--bg-3); overflow:hidden; width:100%; }
  .rvc .media img { width:100%; height:100%; object-fit:cover; display:block; }
  .rvc .media video { object-fit:cover; }
  .rvc .date { font-size:11px; color:var(--ink-3); margin-top:auto; }
  .empty { padding: 60px 0; text-align:center; color: var(--ink-3); }
  footer { padding-block:28px 48px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-3); }
  .lb { position:fixed; inset:0; background:rgba(0,0,0,.9); display:grid; place-items:center; z-index:20; padding:20px; }
  .lb img { max-width:100%; max-height:90vh; object-fit:contain; }
  .lb button { position:absolute; top:14px; right:14px; width:40px; height:40px; border:0; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; font-size:22px; cursor:pointer; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 24px; } .top .back { display:none; } .brand small { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="../">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4.5 10.5 12 4l7.5 6.5"/><path d="M6 9.5V17a1.5 1.5 0 0 0 1.5 1.5h5.5l4 3.2v-3.2A1.5 1.5 0 0 0 18 17V9.5"/></svg>
      하우스토리 <small>HOUSE-TORY</small>
    </a>
    <div class="r"><a class="back" href="../">‹ 메인으로</a><a class="cta" href="../#apply">상담 신청</a></div>
  </header>

  <section class="head">
    <div>
      <a class="back" href="../#reviews" style="margin-bottom:14px">‹ 뒤로 가기</a>
      <h1>고객 후기 <span id="count"></span></h1>
      <div class="sum" id="sum">조립 받은 분들이 직접 남긴 후기예요. 이름은 가려서 올려요.</div>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>아직 올라온 후기가 없어요. 첫 후기를 기다리고 있어요.</div>

  <footer><a class="back" href="../">‹ 메인으로 돌아가기</a><div style="margin-top:14px">© 2026 하우스토리</div></footer>
</div>

<script src="../config.js"></script>
<script>
(function () {
  var C = window.HOWSTORY_CONFIG || {};
  var base = (C.SUPABASE_URL || '').replace(/\/$/, '');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var all = []; var filter = '전체';
  function card(v) {
    var stars = '★★★★★'.slice(0, v.rating) + '☆☆☆☆☆'.slice(0, 5 - v.rating);
    var d = new Date(v.at); var date = d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate();
    var media = (v.media || []).map(function (m) {
      var u = base + '/storage/v1/object/public/reviews/' + m.path;
      return m.type === 'video' ? '<video src="' + esc(u) + '" controls playsinline preload="metadata"></video>' : '<a href="' + esc(u) + '" data-lb="1"><img src="' + esc(u) + '" alt="고객 후기 사진" loading="lazy"></a>';
    }).join('');
    return '<article class="rvc"><div class="tp"><span class="name">' + esc(v.name) + ' 고객님<small>' + esc(v.purpose || '') + (v.budget ? ' · ' + esc(v.budget) + '만원' : '') + '</small></span><span class="stars" aria-label="' + v.rating + '점">' + stars + '</span></div>' +
      '<div class="body">' + esc(v.body) + '</div>' + (media ? '<div class="media">' + media + '</div>' : '') + '<div class="date">' + date + '</div></article>';
  }
  function render() {
    var list = filter === '전체' ? all : all.filter(function (v) { return (v.purpose || '기타') === filter; });
    document.getElementById('grid').innerHTML = list.map(card).join('');
    document.getElementById('empty').hidden = list.length > 0;
  }
  function chips() {
    var counts = {}; all.forEach(function (v) { var k = v.purpose || '기타'; counts[k] = (counts[k] || 0) + 1; });
    var keys = ['전체'].concat(Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }));
    var el = document.getElementById('chips');
    el.innerHTML = keys.map(function (k) { return '<button type="button" class="chip" data-k="' + esc(k) + '" aria-pressed="' + (k === filter) + '">' + esc(k) + (k === '전체' ? '' : ' ' + counts[k]) + '</button>'; }).join('');
    el.querySelectorAll('.chip').forEach(function (b) { b.addEventListener('click', function () { filter = b.dataset.k; chips(); render(); }); });
  }
  if (!base || !C.SUPABASE_ANON_KEY) { document.getElementById('empty').hidden = false; return; }
  fetch(base + '/rest/v1/rpc/public_reviews', { method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': C.SUPABASE_ANON_KEY }, body: '{}' })
    .then(function (r) { return r.ok ? r.json() : []; }).then(function (list) {
      all = Array.isArray(list) ? list : [];
      var avg = all.length ? (all.reduce(function (a, v) { return a + v.rating; }, 0) / all.length) : 0;
      document.getElementById('count').textContent = all.length ? all.length : '';
      if (all.length) document.getElementById('sum').innerHTML = '평균 <b>' + (Math.round(avg * 10) / 10) + '점</b> · ' + all.length + '명이 남겨 주셨어요. 이름은 가려서 올려요.';
      chips(); render();
    }).catch(function () { document.getElementById('empty').hidden = false; });
  // 사진 크게 보기
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-lb]'); if (!a) return;
    e.preventDefault();
    var lb = document.createElement('div'); lb.className = 'lb'; lb.innerHTML = '<img src="' + esc(a.getAttribute('href')) + '" alt=""><button type="button" aria-label="닫기">×</button>';
    lb.addEventListener('click', function () { lb.remove(); });
    document.body.appendChild(lb);
  });
})();
</script>
</body>
</html>
