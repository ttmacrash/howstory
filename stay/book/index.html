<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>예약 · 하우스토리 스테이</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23171B26'/%3E%3Cg fill='none' stroke='%23F2B84B' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' transform='translate(2 2) scale(.8333)'%3E%3Cpath d='M4.5 10.5 12 4l7.5 6.5'/%3E%3Cpath d='M6 9.5V17a1.5 1.5 0 0 0 1.5 1.5h5.5l4 3.2v-3.2A1.5 1.5 0 0 0 18 17V9.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
  :root { --bg:#FFFCF5; --sand:#F6EEDF; --sand-2:#EEE3CE; --line:#E8DCC6; --ink:#2A2521; --ink-2:#6A5F55; --ink-3:#9C9083; --navy:#24324D; --navy-2:#1B2740; --gold:#F2B84B; --gold-deep:#C98A1B; --gold-soft:#FBF0D6; --oak:#B8834A; --accent:#C98A1B; --shadow:0 18px 48px rgba(104,74,30,.14); --r:18px; --r-sm:12px; }
  * { box-sizing: border-box; }
  html { color-scheme: light; scroll-behavior: smooth; overflow-x:clip; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Pretendard, "Pretendard Variable", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; font-size:15px; line-height:1.65; letter-spacing:-0.01em; -webkit-font-smoothing:antialiased; overflow-x:clip; }
  html[lang="zh"] body { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing:0; }
  html[lang="ja"] body { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing:0; }
  html[lang="en"] body { letter-spacing:0; }
  html[lang="ko"] body, html[lang="en"] body { word-break:keep-all; overflow-wrap:break-word; }
  a { color: inherit; }
  button, select { font: inherit; color: inherit; }
  h1, h2, h3 { margin:0; text-wrap: balance; line-height:1.25; font-weight:700; letter-spacing:-0.02em; }
  h2 { font-size: 26px; letter-spacing:-0.03em; }
  p { margin: 0; }
  :focus-visible { outline:2px solid var(--gold-deep); outline-offset:3px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; }

  /* 상단바 — 테크와 위치·크기 동일 */
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; height:60px; border-bottom:1px solid var(--line); position:relative; z-index:3; }
  .brand { display:inline-flex; align-items:center; gap:10px; font-weight:900; font-size:20px; letter-spacing:-0.04em; text-decoration:none; white-space:nowrap; }
  .brand svg { width:30px; height:auto; color:var(--gold-deep); }
  .brand small { font-weight:500; font-size:11px; letter-spacing:.22em; color:var(--ink-3); }
  .switch { display:inline-flex; border:1px solid var(--line); margin-left:14px; border-radius:999px; overflow:hidden; background:#fff; }
  .switch a { padding:5px 10px; font-size:12px; font-weight:700; text-decoration:none; color:var(--ink-3); white-space:nowrap; }
  .switch a + a { border-left:1px solid var(--line); }
  .switch a[aria-current="page"] { background:var(--navy); color:#fff; }
  .nav { display:flex; gap:22px; font-size:14px; font-weight:500; }
  .nav a { text-decoration:none; color:var(--ink-2); white-space:nowrap; }
  .nav a:hover { color:var(--ink); }
  .right { display:flex; align-items:center; gap:8px; }
  .lang { position:relative; }
  .lang select { appearance:none; -webkit-appearance:none; padding:7px 28px 7px 10px; font-family: inherit, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji'; border:1px solid var(--line); background:#fff; font-size:13px; font-weight:700; cursor:pointer; border-radius:999px; }
  .lang::after { content:""; position:absolute; right:11px; top:50%; width:6px; height:6px; border-right:1.5px solid var(--ink-2); border-bottom:1.5px solid var(--ink-2); transform:translateY(-70%) rotate(45deg); pointer-events:none; }
  .cta { font-size:13px; font-weight:700; padding:8px 14px; background:var(--navy); color:#fff; text-decoration:none; white-space:nowrap; border-radius:999px; }
  .cta:hover { background:var(--navy-2); }


  [hidden] { display:none !important; }
  @media (max-width: 960px) { .nav { display:none; } }
  @media (max-width: 560px) {
    .brand { font-size:17px; gap:6px; } .brand svg { width:24px; } .brand small { display:none; } .switch { margin-left:6px; } .switch a { padding:5px 7px; font-size:11px; } .lang select { padding:6px 22px 6px 8px; font-size:12px; } .lang::after { right:8px; } .cta { display:none; } .top { gap:8px; }
    .head h2 { font-size:24px; }
  }
  .backlink { display:none; font-size:13px; font-weight:700; color:var(--ink-2); text-decoration:none; margin-bottom:14px; }
  .backlink:hover { color:var(--ink); }
  @media (max-width: 960px) { .backlink { display:inline-block; } }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; padding:14px 22px; font-weight:700; font-size:15px; cursor:pointer; text-decoration:none; background:var(--navy); color:#fff; border-radius:var(--r-sm); }
  .btn:hover { background:var(--navy-2); }
  .btn.line { background:#fff; color:var(--navy); border:1.5px solid var(--navy); }
  .btn.line:hover { background:var(--navy); color:#fff; }
  .kakao { display:inline-flex; align-items:center; justify-content:center; gap:7px; background:#FEE500; color:#191919; font-weight:700; text-decoration:none; border:0; padding:14px 20px; font-size:15px; border-radius:var(--r-sm); }
  .kakao:hover { background:#F5DC00; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .guide { display:inline-flex; border:1.5px solid var(--navy); border-radius:var(--r-sm); overflow:hidden; background:#fff; }
  .guide a { padding:10px 16px; font-weight:700; font-size:15px; text-decoration:none; color:var(--navy); }
  .guide a + a { border-left:1.5px solid var(--navy); }
  .guide a small { display:block; font-size:11px; font-weight:500; color:var(--ink-3); line-height:1.2; }
  .guide a:hover { background:var(--navy); color:#fff; }
  .guide a:hover small { color:inherit; }
  h1, h2, h3 { font-family: "Noto Serif KR", "Noto Serif JP", "Noto Serif SC", Georgia, serif; font-weight:600; letter-spacing:-0.01em; }
  .nav a { font-size:13px; }
  section.block.book { padding-block:36px 40px; }
  .head { margin-bottom:18px; }
  .head h2 { font-size:28px; }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:.22em; color:var(--gold-deep); text-transform:uppercase; margin-bottom:8px; }
  /* 예약 — 신라식 3단계 흐름 */
  .stepbar { list-style:none; margin:0 0 20px; padding:0; display:flex; gap:8px; }
  .stepbar li { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--ink-3); padding:8px 14px 8px 8px; border-radius:999px; background:#fff; border:1px solid var(--line); }
  .stepbar li i { font-style:normal; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--sand); color:var(--ink-3); font-size:12px; }
  .stepbar li.on { color:var(--ink); border-color:var(--navy); }
  .stepbar li.on i { background:var(--navy); color:#fff; }
  .stepbar li.done i { background:var(--gold); color:var(--ink); }
  .bk { display:grid; grid-template-columns: 1fr 340px; gap:24px; align-items:start; }
  .bk-main { display:grid; gap:16px; min-width:0; }
  .sbar { display:grid; grid-template-columns: 1fr 1fr 1fr auto; gap:8px; background:#fff; border-radius:var(--r); padding:8px; box-shadow:var(--shadow); }
  .sb { display:flex; flex-direction:column; gap:2px; text-align:left; padding:10px 14px; border:1.5px solid transparent; border-radius:12px; background:var(--bg); cursor:pointer; font:inherit; color:inherit; min-width:0; }
  .sb small { font-size:11px; font-weight:700; color:var(--ink-3); }
  .sb b { font-size:15px; font-weight:800; letter-spacing:-0.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sb.on { border-color:var(--navy); background:#fff; }
  .sb.guests { cursor:default; }
  .sb.reset { align-self:stretch; justify-content:center; align-items:center; font-size:12px; font-weight:700; color:var(--ink-2); padding:10px 12px; }
  .sb.reset:hover { color:var(--ink); }
  .stp { display:flex; align-items:center; gap:10px; }
  .stp button { width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:#fff; font-size:16px; line-height:1; cursor:pointer; color:var(--ink); }
  .stp button:disabled { opacity:.35; cursor:default; }
  .stp b { font-size:15px; font-weight:800; min-width:1.4em; text-align:center; }

  .cal { background:#fff; border-radius:var(--r); padding:16px 18px 14px; box-shadow:var(--shadow-sm, 0 8px 24px rgba(104,74,30,.08)); }
  .cal-nav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .cal-nav button { width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:18px; color:var(--ink); }
  .cal-nav button:disabled { opacity:.3; cursor:default; }
  .cal-months { display:grid; grid-template-columns:1fr 1fr; gap:24px; flex:1; text-align:center; font-weight:800; font-size:15px; letter-spacing:-0.02em; }
  .cal-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .month { display:grid; grid-template-columns:repeat(7, 1fr); gap:2px; }
  .month .dow { font-size:11px; font-weight:700; color:var(--ink-3); text-align:center; padding:4px 0 6px; }
  .month .dow.sat { color:#3A5BA0; } .month .dow.sun { color:#C0392B; }
  .day { aspect-ratio: 1 / 1.05; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; border-radius:10px; border:0; background:transparent; cursor:pointer; font:inherit; color:var(--ink); padding:0; position:relative; }
  .day b { font-size:13px; font-weight:700; line-height:1; }
  .day small { font-size:10px; color:var(--ink-3); line-height:1; letter-spacing:-0.02em; }
  .day.sun b { color:#C0392B; } .day.sat b { color:#3A5BA0; }
  .day:hover:not(:disabled) { background:var(--sand); }
  .day:disabled { cursor:default; color:var(--ink-3); }
  .day.past b { color:#C9C1B4; } .day.past small { visibility:hidden; }
  .day.blocked b { text-decoration: line-through; color:#B8AE9F; } .day.blocked small { visibility:hidden; }
  .day.blocked::after { content:""; position:absolute; inset:6px; border-radius:8px; background:repeating-linear-gradient(135deg, transparent 0 4px, rgba(0,0,0,.04) 4px 6px); }
  .day.in-range { background:var(--gold-soft); border-radius:0; }
  .day.in-range small { color:var(--gold-deep); }
  .day.start, .day.end { background:var(--navy); color:#fff; border-radius:10px; }
  .day.start b, .day.end b { color:#fff; } .day.start small, .day.end small { color:rgba(255,255,255,.8); }
  .day.start { border-top-right-radius:0; border-bottom-right-radius:0; } .day.end { border-top-left-radius:0; border-bottom-left-radius:0; }
  .day.start.end { border-radius:10px; }
  .day.today b::after { content:""; display:block; width:4px; height:4px; border-radius:50%; background:var(--gold-deep); margin:2px auto 0; }
  .day.empty { visibility:hidden; }
  .cal-legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:10px; font-size:11px; color:var(--ink-3); }
  .cal-legend span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .cal-legend .l-open::before { background:#fff; border:1px solid var(--line); }
  .cal-legend .l-sel::before { background:var(--navy); }
  .cal-legend .l-blk::before { background:#E3DCCE; }
  .cal-msg { margin-top:8px; font-size:13px; color:#B4412B; font-weight:600; }

  .plans { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
  .plan { background:#fff; border-radius:var(--r-sm); padding:18px; border:1.5px solid var(--line); text-align:left; cursor:pointer; font:inherit; color:inherit; display:grid; gap:6px; align-content:start; position:relative; }
  .plan:hover:not(:disabled) { border-color:var(--ink-3); }
  .plan.on { border-color:var(--navy); box-shadow:0 0 0 3px rgba(36,50,77,.12); }
  .plan:disabled { opacity:.45; cursor:default; }
  .plan .pn { font-weight:800; font-size:16px; letter-spacing:-0.02em; }
  .plan .pg { font-size:12px; color:var(--ink-3); }
  .plan .pp { margin-top:6px; font-size:13px; color:var(--ink-2); display:grid; gap:2px; }
  .plan .pp b { color:var(--ink); }
  .plan .pt { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:13px; display:flex; justify-content:space-between; align-items:baseline; }
  .plan .pt b { font-size:16px; font-weight:800; letter-spacing:-0.02em; }
  .plan .chk { position:absolute; top:12px; right:12px; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; font-size:12px; color:#fff; }
  .plan.on .chk { background:var(--navy); border-color:var(--navy); }
  .plan.on .chk::after { content:"✓"; }

  .bk-side { position:sticky; top:16px; }
  .sum { background:#fff; border-radius:var(--r); padding:22px; box-shadow:var(--shadow); }
  .sum h3 { font-size:17px; }
  .sum-rows { margin:14px 0 0; display:grid; gap:6px; font-size:13px; }
  .sum-rows div { display:flex; justify-content:space-between; gap:12px; }
  .sum-rows dt { color:var(--ink-3); } .sum-rows dd { margin:0; font-weight:700; text-align:right; }
  .sum-rows dd.dim { color:var(--ink-3); font-weight:500; }
  .sum-total { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; }
  .sum-total span { font-size:13px; color:var(--ink-2); font-weight:700; }
  .sum-total b { font-size:22px; font-weight:800; letter-spacing:-0.03em; }
  .sum form { margin-top:16px; display:grid; gap:12px; }
  .sum .f { display:flex; flex-direction:column; gap:6px; }
  .sum .f label { font-size:13px; font-weight:700; }
  .sum .f input, .sum .f textarea { font:inherit; font-size:15px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:11px 13px; width:100%; }
  .sum .f input:focus, .sum .f textarea:focus { outline:none; border-color:var(--navy); background:#fff; }
  .sum .f textarea { resize:vertical; }
  .sum .f .hint { font-size:12px; color:var(--ink-3); }
  .sum .btn { width:100%; }
  .sum .btn:disabled { opacity:.4; cursor:default; }
  .sum .err { font-size:13px; color:#B4412B; font-weight:600; margin:0; }
  .sent { display:grid; gap:10px; margin-top:16px; padding:16px; background:var(--gold-soft); border-radius:var(--r-sm); }
  .sent b { font-size:15px; } .sent p { font-size:13px; color:var(--ink-2); }
  .sent .kakao { padding:11px 16px; font-size:14px; }
  .bk-alt { margin-top:18px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; font-size:13px; color:var(--ink-3); }
  .bk-alt .kakao.sm { padding:9px 14px; font-size:13px; }
  .bk-alt .btn.sm { padding:9px 14px; font-size:13px; }
  .bk-alt .guide.sm a { padding:6px 12px; font-size:13px; }
  .bk-alt .guide.sm a small { font-size:10px; }
  .way { margin-top:56px; }
  @media (max-width: 960px) { .bk { grid-template-columns:1fr; } .bk-side { position:static; } }
  @media (max-width: 860px) {
    .sbar { grid-template-columns:1fr 1fr; }
    .sb.reset { grid-column: 2; }
    .cal-months, .cal-grid { grid-template-columns:1fr; }
    .cal-grid .month + .month, .cal-months span + span { display:none; }
    .plans { grid-template-columns:1fr; }
    .plan .pg { padding-right:28px; }
    .way { margin-top:40px; }
  }
  @media (max-width: 560px) { .sum .f input, .sum .f textarea { font-size:16px; } .stepbar li span { display:none; } .stepbar li.on span { display:inline; } }

  footer { padding-block:28px 48px; margin-top:24px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-3); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  footer b { color:var(--ink); font-weight:800; font-size:14px; letter-spacing:-0.03em; }
  footer a { text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div style="display:flex;align-items:center;min-width:0">
      <a class="brand" href="../../">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4.5 10.5 12 4l7.5 6.5"/><path d="M6 9.5V17a1.5 1.5 0 0 0 1.5 1.5h5.5l4 3.2v-3.2A1.5 1.5 0 0 0 18 17V9.5"/></svg>
        하우스토리 <small>HOUSE-TORY</small>
      </a>
      <div class="switch" aria-label="HOUSE-TORY"><a href="../" aria-current="page" data-i="sw_stay">스테이</a><a href="../../" data-i="sw_tech">테크</a></div>
    </div>
    <nav class="nav"><a href="../" data-i="back">← 스테이 소개로</a></nav>
    <div class="right">
      <div class="lang"><select id="lang" aria-label="Language">
        <option value="ko">🇰🇷 한국어</option>
        <option value="en">🇺🇸 English</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ja">🇯🇵 日本語</option>
      </select></div>
      <a class="cta" href="https://pf.kakao.com/_xiZxbxan/chat" target="_blank" rel="noopener" data-i="cta">카톡 문의</a>
    </div>
  </header>

<section class="block book" id="book">
    <a class="backlink" href="../" data-i="back">← 스테이 소개로</a>
    <div class="head"><div><div class="eyebrow">HOUSE-TORY STAY · SAEJEOL</div><h2 data-i="bk_h">예약</h2></div><p id="bkSub"></p></div>
    <ol class="stepbar" id="stepbar"><li class="on"><i>1</i><span></span></li><li><i>2</i><span></span></li><li><i>3</i><span></span></li></ol>
    <div class="bk">
      <div class="bk-main">
        <div class="sbar">
          <button type="button" class="sb" id="sbIn"><small></small><b>—</b></button>
          <button type="button" class="sb" id="sbOut"><small></small><b>—</b></button>
          <div class="sb guests"><small id="sbGuestsL"></small><div class="stp"><button type="button" id="gMinus" aria-label="-">−</button><b id="gNum">2</b><button type="button" id="gPlus" aria-label="+">+</button></div></div>
          <button type="button" class="sb reset" id="sbReset"></button>
        </div>
        <div class="cal" id="cal">
          <div class="cal-nav"><button type="button" id="calPrev" aria-label="prev">‹</button><div class="cal-months" id="calMonths"></div><button type="button" id="calNext" aria-label="next">›</button></div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-legend" id="calLegend"></div>
          <p class="cal-msg" id="calMsg" hidden></p>
        </div>
        <div class="plans" id="plans"></div>
      </div>
      <aside class="bk-side">
        <div class="sum" id="sum">
          <h3 id="sumH"></h3>
          <dl class="sum-rows" id="sumRows"></dl>
          <div class="sum-total"><span id="sumTotalL"></span><b id="sumTotal">—</b></div>
          <form id="bkForm" novalidate>
            <div class="f"><label for="bkName" id="bkNameL"></label><input id="bkName" name="name" type="text" autocomplete="name"></div>
            <div class="f"><label for="bkContact" id="bkContactL"></label><input id="bkContact" name="contact" type="text" autocomplete="tel" inputmode="text" required><span class="hint" id="bkContactH"></span></div>
            <div class="f"><label for="bkMemo" id="bkMemoL"></label><textarea id="bkMemo" name="memo" rows="3"></textarea></div>
            <button class="btn" type="submit" id="bkSend" disabled></button>
            <p class="note" id="bkNote"></p>
            <p class="err" id="bkErr" hidden></p>
          </form>
          <div class="sent" id="bkSent" hidden>
            <b id="sentH"></b><p id="sentP"></p>
            <a class="kakao" href="https://pf.kakao.com/_xiZxbxan/chat" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.8 5.2 4.6 6.6-.2.7-.8 2.7-.9 3.1 0 .3.1.5.4.4.3-.1 3.4-2.3 4.7-3.2.4 0 .8.1 1.2.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg><span id="sentKakao"></span></a>
          </div>
        </div>
      </aside>

          '<span class="pn">' + x.plan(p.guests) + '</span><span class="pg">' + (fit ? x.pg(p.guests) : x.tooSmall(st.guests)) + '</span>' +
          '<span class="pp"><span>' + x.wd + ' <b>' + x.won(p.weekday_price) + '</b></span><span>' + x.we + ' <b>' + x.won(p.weekend_price) + '</b></span></span>' +
          '<span class="pt"><span>' + (n ? x.nightsN(n) + ' ' + x.total : x.needDates) + '</span>' + (tot != null ? '<b>' + x.won(tot) + '</b>' : '') + '</span></button>';
      }).join('');
    }
    function renderSum(x) {
      var p = st.plan ? st.plans.filter(function (q) { return q.id === st.plan; })[0] : null, n = st.in_ && st.out ? nights(st.in_, st.out) : 0, tot = total(p);
      $('sumH').textContent = x.sum;
      $('sumRows').innerHTML = '<div><dt>' + x.s_dates + '</dt><dd' + (st.in_ && st.out ? '' : ' class="dim"') + '>' + (st.in_ && st.out ? fmtDate(st.in_) + ' → ' + fmtDate(st.out) : x.s_none) + '</dd></div>' +
        '<div><dt>' + x.s_nights + '</dt><dd' + (n ? '' : ' class="dim"') + '>' + (n ? x.nightsN(n) : '—') + '</dd></div>' +
        '<div><dt>' + x.s_guests + '</dt><dd>' + x.gN(st.guests) + '</dd></div>' +
        '<div><dt>' + x.s_plan + '</dt><dd' + (p ? '' : ' class="dim"') + '>' + (p ? x.plan(p.guests) : x.s_none) + '</dd></div>';
      $('sumTotalL').textContent = x.s_total; $('sumTotal').textContent = tot != null ? x.won(tot) : '—';
      $('bkNameL').textContent = x.name; $('bkContactL').textContent = x.contact; $('bkContactH').textContent = x.contact_h; $('bkMemoL').textContent = x.memo; $('bkMemo').placeholder = x.memo_ph;
      $('bkSend').textContent = x.send; $('bkNote').textContent = x.note; $('bkAltL').textContent = x.alt;
      $('bkSend').disabled = !(st.in_ && st.out && p) || st.sent;
      $('sentH').textContent = x.sent_h; $('sentKakao').textContent = x.sent_k; if (st.sent) $('sentP').textContent = x.sent_p(rangeText());
      $('bkForm').hidden = st.sent; $('bkSent').hidden = !st.sent;
    }
    function msg(m) { var el = $('calMsg'); el.textContent = m || ''; el.hidden = !m; }

    // ---- 상호작용 ----
    $('calGrid').addEventListener('click', function (e) {
      var b = e.target.closest('.day'); if (!b || b.disabled || b.classList.contains('empty')) return;
      var s = b.dataset.d, x = t(); msg('');
      if (!st.in_ || st.out || s <= st.in_) {
        if (!avail(s)) { msg(x.blocked); return; }
        st.in_ = s; st.out = null; st.hover = null;
      } else {
        var d = st.in_, ok = true; while (d < s) { if (!avail(d)) { ok = false; break; } d = addDays(d, 1); }
        if (!ok) { msg(x.blocked); st.in_ = null; render(); return; }
        if (nights(st.in_, s) > 30) { msg(x.maxn); return; }
        st.out = s;
      }
      render();
    });
    $('calGrid').addEventListener('mouseover', function (e) { var b = e.target.closest('.day'); if (!b || !st.in_ || st.out) return; if (st.hover !== b.dataset.d) { st.hover = b.dataset.d; render(); } });
    $('calGrid').addEventListener('mouseleave', function () { if (st.hover) { st.hover = null; render(); } });
    $('calPrev').addEventListener('click', function () { st.view = new Date(st.view.getFullYear(), st.view.getMonth() - 1, 1); render(); });
    $('calNext').addEventListener('click', function () { st.view = new Date(st.view.getFullYear(), st.view.getMonth() + 1, 1); render(); });
    $('gMinus').addEventListener('click', function () { if (st.guests > 1) { st.guests--; if (st.plan && planFor() && planFor().id !== st.plan) {} render(); } });
    $('gPlus').addEventListener('click', function () { if (st.guests < 6) { st.guests++; var p = st.plans.filter(function (q) { return q.id === st.plan; })[0]; if (p && p.guests < st.guests) st.plan = null; render(); } });
    $('sbReset').addEventListener('click', function () { st.in_ = st.out = st.plan = null; st.guests = 2; msg(''); render(); });
    $('sbIn').addEventListener('click', function () { st.in_ = st.out = null; render(); $('cal').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
    $('sbOut').addEventListener('click', function () { st.out = null; render(); $('cal').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
    $('plans').addEventListener('click', function (e) { var b = e.target.closest('.plan'); if (!b || b.disabled) return; st.plan = b.dataset.p; render(); if (window.innerWidth <= 960) $('sum').scrollIntoView({ block: 'start', behavior: 'smooth' }); });

    $('bkForm').addEventListener('submit', function (e) {
      e.preventDefault(); var x = t(), err = $('bkErr'); err.hidden = true;
      var p = st.plans.filter(function (q) { return q.id === st.plan; })[0];
      if (!(st.in_ && st.out && p)) { err.textContent = x.e_incomplete; err.hidden = false; return; }
      var contact = $('bkContact').value.trim(); if (!contact) { err.textContent = x.e_contact; err.hidden = false; $('bkContact').focus(); return; }
      var n = nights(st.in_, st.out), tot = total(p);
      var row = { check_in: st.in_, check_out: st.out, nights: n, plan_id: p.id, guests: st.guests, total: tot, name: $('bkName').value.trim() || null, contact: contact, memo: $('bkMemo').value.trim() || null, lang: lang(), status: 'new', source: 'site' };
      var btn = $('bkSend'); btn.disabled = true;
      var toDb = (BASE && KEY) ? fetch(BASE + '/rest/v1/stay_bookings', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify(row) }).then(function (r) { return r.ok; }).catch(function () { return false; }) : Promise.resolve(false);
      var mail = { _subject: '[하우스토리 스테이] 예약 요청 ' + st.in_ + ' → ' + st.out + ' · ' + st.guests + '명', 구분: '스테이 예약 요청', 체크인: st.in_, 체크아웃: st.out, 박수: n, 인원: st.guests, 플랜: p.guests + '인 플랜', 총액: tot + '원', 이름: row.name || '', 연락처: contact, 요청사항: row.memo || '', 언어: lang() };
      var toMail = fetch(FORM, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(mail) }).then(function (r) { return r.ok; }).catch(function () { return false; });
      Promise.all([toDb, toMail]).then(function (rs) {
        if (rs[0] || rs[1]) { st.sent = true; render(); $('sum').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
        else { err.textContent = x.e_fail; err.hidden = false; btn.disabled = false; }
      });
    });

    load();
    return { render: render, state: st };
  })();
  window.__applyLang(window.__initLang);
})();
</script>
</body>
</html>
